spring.application.name=learning-tracker
spring.datasource.url=jdbc:postgresql://localhost:5432/learning_tracker
spring.datasource.username= root
spring.datasource.password= root

# Hibernate only checks that entities match the schema; Flyway owns all schema changes.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Lets Flyway adopt an existing non-empty schema that has no migration history.
spring.flyway.baseline-on-migrate=true

# Limits for the PDF upload endpoint.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Swagger UI properties
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
